openapi: 3.1.0
info:
  title: Cortex Universal Reference API
  version: 0.6.0
  description: >-
    Ontology-governed validation, policy, persistent memory, hybrid retrieval, agent coordination,
    MCP, and bounded cognitive computation. This API does not execute business actions.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /:
    get:
      operationId: serviceInfo
      security: []
      responses:
        '200':
          description: Local service information and discovery links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, version, status, endpoints]
                properties:
                  service: { type: string }
                  version: { type: string }
                  status: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /dashboard:
    get:
      operationId: redirectDashboard
      security: []
      responses:
        '302':
          description: Redirects to the local semantic graph dashboard.
  /dashboard/:
    get:
      operationId: getDashboard
      security: []
      responses:
        '200':
          description: Local dashboard shell. Graph data still requires bearer authentication.
          content:
            text/html:
              schema: { type: string }
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: Trusted ontology, schemas, shapes, and policies are loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/manifest:
    get:
      operationId: getManifest
      responses:
        '200':
          description: Versioned package manifest.
          content:
            application/json:
              schema:
                $ref: ./schemas/package-manifest.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/graph:
    get:
      operationId: getCortexGraph
      description: Read-only ontology, SHACL, action, and policy projection for visualization.
      responses:
        '200':
          description: Deterministic semantic graph snapshot.
          content:
            application/json:
              schema:
                $ref: ./schemas/graph-snapshot.schema.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ontology/reasoning:
    get:
      operationId: getOntologyReasoning
      description: >-
        Returns bounded explainable RDFS and OWL-RL-subset inferences. The response explicitly
        does not claim complete OWL 2 reasoning.
      responses:
        '200':
          description: Inference and consistency report for the loaded ontology.
          content:
            application/json:
              schema:
                $ref: ./schemas/reasoning-report.schema.json
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/brain/health:
    get:
      operationId: getBrainHealth
      responses:
        '200': { description: Embedded persistence and retrieval engine health. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/brain/ingest:
    post:
      operationId: ingestEvidence
      description: Validates hash, provenance and scope before atomically indexing evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/brain-ingestion.schema.json
      responses:
        '201': { description: Evidence accepted and indexed. }
        '200': { description: Idempotent duplicate already indexed. }
        '400': { description: Invalid contract or content hash. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/brain/retrieve:
    post:
      operationId: retrieveMemory
      description: Tenant-scoped keyword, vector and graph retrieval with deterministic rank fusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/retrieval-request.schema.json
      responses:
        '200':
          description: Evidence-bearing retrieval response with explicit gaps.
          content:
            application/json:
              schema:
                $ref: ./schemas/retrieval-response.schema.json
        '400': { description: Invalid retrieval contract. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/brain/activity:
    get:
      operationId: getBrainActivity
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: brain_id, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Recent persisted operational records for one tenant and brain scope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [activity]
                properties:
                  activity:
                    type: array
                    items:
                      $ref: ./schemas/brain-activity.schema.json
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/registry:
    get:
      operationId: getAgentRegistry
      responses:
        '200': { description: Trusted agent definitions and bounded capabilities. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/guard/evaluate:
    post:
      operationId: evaluateToolProposal
      description: >-
        Applies schema, identity, ontology-bound action policy, agent capability, approval,
        idempotency and loop-budget controls. A decision never executes the proposed effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/tool-proposal.schema.json
      responses:
        '200':
          description: Persisted allow or deny decision with effect_executed false.
          content:
            application/json:
              schema:
                $ref: ./schemas/guard-decision.schema.json
        '400': { description: Proposal is malformed, expired or outside its session scope. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Identity, capability or policy denied the proposal. }
  /v1/agents/sessions:
    post:
      operationId: createAgentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/agent-session.schema.json
      responses:
        '201': { description: Governed coordination session created. }
        '400': { description: Invalid or untrusted agent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/sessions/{id}:
    get:
      operationId: getAgentSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: brain_id, required: true, schema: { type: string } }
      responses:
        '200': { description: Tenant-scoped coordination session. }
        '404': { description: Session is absent or outside the supplied scope. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/sessions/{id}/handoffs:
    post:
      operationId: proposeAgentHandoff
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/agent-handoff.schema.json
      responses:
        '200': { description: Evidence-bearing handoff recorded; no external action executed. }
        '400': { description: Invalid handoff or registry violation. }
        '404': { description: Session not found. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mcp:
    post:
      operationId: streamableHttpMcp
      description: MCP Streamable HTTP over the same authenticated governed services.
      responses:
        '200': { description: MCP JSON-RPC response or stream. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Host or Origin rejected. }
        '405': { description: Only POST is accepted in stateless mode. }
  /v1/cognition/attention/select:
    post:
      operationId: selectAttention
      description: Selects a bounded working set deterministically; performs no external action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/attention-selection.schema.json
      responses:
        '200': { description: Ranked selected and deferred candidates. }
        '400': { description: Contract or cognitive invariant violation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/cognition/prediction/evaluate:
    post:
      operationId: evaluatePredictionError
      description: Compares predictions with observations and recommends deliberation when error is high.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/prediction-observation.schema.json
      responses:
        '200': { description: Normalized prediction-error assessment. }
        '400': { description: Contract or cognitive invariant violation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/cognition/metacognition/evaluate:
    post:
      operationId: evaluateMetacognition
      description: Measures accuracy, confidence bias, Brier score, and expected calibration error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/metacognitive-evaluation.schema.json
      responses:
        '200': { description: Confidence calibration assessment. }
        '400': { description: Contract or cognitive invariant violation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/cognition/consolidation/propose:
    post:
      operationId: proposeConsolidation
      description: Ranks episodic traces for review; never writes trusted memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/consolidation-proposal.schema.json
      responses:
        '200': { description: Review-required consolidation proposal with zero writes. }
        '400': { description: Contract or cognitive invariant violation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/cognition/cycle/validate:
    post:
      operationId: validateCognitiveCycle
      description: Validates a bounded, evidence-referenced cognitive event sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/cognitive-cycle.schema.json
      responses:
        '200': { description: Cycle contract and transition order conform. }
        '400': { description: Cycle contract is malformed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: A well-formed cycle contains an invalid transition. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/audit/integrity:
    get:
      operationId: verifyAuditIntegrity
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: brain_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Append-only audit hash chain is valid.
          content:
            application/json:
              schema:
                $ref: ./schemas/audit-integrity.schema.json
        '400': { description: Required scope is absent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Audit chain verification found an invalid event.
          content:
            application/json:
              schema:
                $ref: ./schemas/audit-integrity.schema.json
  /v1/observability/metrics:
    get:
      operationId: getObservabilityMetrics
      description: Returns payload-free in-process request, error and duration aggregates.
      responses:
        '200': { description: Payload-free metrics snapshot. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Observability permission denied. }
  /v1/observability/failures:
    get:
      operationId: getSanitizedFailures
      description: >-
        Returns a bounded volatile buffer containing operation, status, error fingerprint and
        correlation identifiers. Payloads, identities, tenant ids and secrets are excluded.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Sanitized failures, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [failures]
                properties:
                  failures:
                    type: array
                    items:
                      $ref: ./schemas/sanitized-failure.schema.json
        '400': { description: Invalid limit. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Observability permission denied. }
  /v1/workforce/snapshot:
    get:
      operationId: getWorkforceSnapshot
      description: Returns only persisted tenant-scoped goals, work, routines, evaluations, and measured costs.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BrainId'
      responses:
        '200':
          description: Current governed workforce snapshot; empty collections mean no real records exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkforceSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/goals:
    post:
      operationId: createWorkforceGoal
      description: Creates an idempotent ontology-bound goal with measurable success criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-goal.schema.json }
      responses:
        '201': { $ref: '#/components/responses/WorkforceRecordCreated' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/work-items:
    post:
      operationId: createWorkItem
      description: Creates budgeted work traceable to an active goal and registered agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/work-item.schema.json }
      responses:
        '201': { $ref: '#/components/responses/WorkforceRecordCreated' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/work-items/{id}/checkout:
    post:
      operationId: checkoutWorkItem
      description: Atomically acquires an expiring lease after assignment, blocker, capability, and budget checks.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/work-item-checkout.schema.json }
      responses:
        '200': { $ref: '#/components/responses/WorkforceRecord' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/work-items/{id}/transitions:
    post:
      operationId: transitionWorkItem
      description: Applies the bounded work state machine, evidence rules, and independent review gate.
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/work-item-transition.schema.json }
      responses:
        '200': { $ref: '#/components/responses/WorkforceRecord' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/routines:
    post:
      operationId: createWorkforceRoutine
      description: Creates a bounded recurring work template without executing external effects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-routine.schema.json }
      responses:
        '201': { $ref: '#/components/responses/WorkforceRecordCreated' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/routines/materialize:
    post:
      operationId: materializeWorkforceRoutines
      description: Materializes due routines as tracked work only; it never executes the work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-routine-materialize.schema.json }
      responses:
        '200':
          description: Materialized work and authoritative check timestamp.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [materialized, checked_at]
                properties:
                  materialized:
                    type: array
                    items: { $ref: '#/components/schemas/WorkforceRecord' }
                  checked_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/cost-events:
    post:
      operationId: recordWorkforceCost
      description: Appends provider-reported or evidence-backed allocated usage; estimates are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-cost-event.schema.json }
      responses:
        '201':
          description: Immutable cost event and recalculated work-item totals.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/evaluations:
    post:
      operationId: recordWorkforceEvaluation
      description: Records independent evidence-based evaluation scores for real governed work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-evaluation.schema.json }
      responses:
        '201': { $ref: '#/components/responses/WorkforceRecordCreated' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/workforce/heartbeats:
    post:
      operationId: recordWorkforceHeartbeat
      description: Appends an evidence-backed observed agent status; no liveness is inferred.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./schemas/workforce-heartbeat.schema.json }
      responses:
        '201': { $ref: '#/components/responses/WorkforceRecordCreated' }
        '400': { $ref: '#/components/responses/InvalidOperationalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/validate/json/{schema}:
    post:
      operationId: validateJson
      parameters:
        - name: schema
          in: path
          required: true
          schema:
            enum:
              - action
              - action-registry
              - agent-handoff
              - agent-registry
              - agent-session
              - attention-selection
              - audit-integrity
              - brain-activity
              - brain-ingestion
              - claim
              - cognitive-cycle
              - consolidation-proposal
              - effect-outcome
              - event
              - graph-snapshot
              - guard-decision
              - ingestion-envelope
              - metacognitive-evaluation
              - module-manifest
              - operation-registry
              - package-manifest
              - policy-bundle
              - policy-decision
              - policy-request
              - prediction-observation
              - reasoning-report
              - retrieval-request
              - retrieval-response
              - sanitized-failure
              - shacl-report
              - source-registry
              - tool-proposal
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Input conforms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValidationReport'
        '422':
          description: Input does not conform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonValidationReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Schema name is not registered.
        '413':
          description: Payload exceeds the configured byte limit.
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/validate/shacl:
    post:
      operationId: validateShacl
      requestBody:
        required: true
        content:
          text/turtle:
            schema:
              type: string
      responses:
        '200':
          description: RDF graph conforms.
          content:
            application/json:
              schema:
                $ref: ./schemas/shacl-report.schema.json
        '422':
          description: RDF graph does not conform.
          content:
            application/json:
              schema:
                $ref: ./schemas/shacl-report.schema.json
        '400':
          description: Turtle syntax is invalid or exceeds the RDF quad limit.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload exceeds the configured byte limit.
        '415':
          description: Content-Type is not Turtle.
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/policies/evaluate:
    post:
      operationId: evaluatePolicy
      description: Returns a decision; it never executes the requested action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/policy-request.schema.json
      responses:
        '200':
          description: Deterministic allow or deny decision.
          content:
            application/json:
              schema:
                $ref: ./schemas/policy-decision.schema.json
        '400':
          description: Malformed policy request.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload exceeds the configured byte limit.
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    BrainId:
      name: brain_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkItemId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^work:[a-f0-9]{32}$' }
  responses:
    Unauthorized:
      description: Missing or invalid service token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Request rate exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated identity lacks the permission, tenant, or classification scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidOperationalRequest:
      description: Request violates its closed JSON contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Governed record was not found in the authorized tenant and brain scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, lease, evidence, review, budget, or optimistic-concurrency rule rejected the change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkforceRecord:
      description: Persisted governed workforce record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkforceRecord' }
    WorkforceRecordCreated:
      description: Idempotently created or previously persisted governed workforce record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkforceRecord' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  schemas:
    WorkforceRecord:
      type: object
      additionalProperties: true
      required:
        [id, tenant_id, brain_id, record_type, classification, revision, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        brain_id: { type: string }
        record_type: { enum: [goal, work_item, routine, heartbeat, evaluation] }
        classification: { enum: [public, internal, confidential, restricted] }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkforceSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          tenant_id,
          brain_id,
          generated_at,
          goals,
          work_items,
          routines,
          heartbeats,
          evaluations,
          costs,
        ]
      properties:
        tenant_id: { type: string }
        brain_id: { type: string }
        generated_at: { type: string, format: date-time }
        goals:
          type: array
          items: { $ref: '#/components/schemas/WorkforceRecord' }
        work_items:
          type: array
          items: { $ref: '#/components/schemas/WorkforceRecord' }
        routines:
          type: array
          items: { $ref: '#/components/schemas/WorkforceRecord' }
        heartbeats:
          type: array
          items: { $ref: '#/components/schemas/WorkforceRecord' }
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/WorkforceRecord' }
        costs:
          type: object
          additionalProperties: false
          required:
            [
              input_tokens,
              output_tokens,
              cached_input_tokens,
              total_tokens,
              cost_microusd,
              event_count,
            ]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cached_input_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
            cost_microusd: { type: integer, minimum: 0 }
            event_count: { type: integer, minimum: 0 }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    JsonValidationReport:
      type: object
      additionalProperties: false
      required: [valid, schema, errors]
      properties:
        valid:
          type: boolean
        schema:
          type: string
        errors:
          type: array
          items:
            type: object
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
