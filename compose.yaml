services:
  cortex:
    build:
      context: .
      target: runtime
    environment:
      CORTEX_API_TOKEN: ${CORTEX_API_TOKEN:?set CORTEX_API_TOKEN with at least 32 bytes}
      CORTEX_AUDIT_HMAC_SECRET: ${CORTEX_AUDIT_HMAC_SECRET:?set CORTEX_AUDIT_HMAC_SECRET with at least 32 bytes}
      CORTEX_MAX_BODY_BYTES: ${CORTEX_MAX_BODY_BYTES:-1000000}
      CORTEX_MAX_RDF_QUADS: ${CORTEX_MAX_RDF_QUADS:-10000}
      CORTEX_RATE_LIMIT_MAX: ${CORTEX_RATE_LIMIT_MAX:-120}
      CORTEX_DB_PATH: /data/cortex.db
      CORTEX_ALLOWED_MCP_HOSTS: ${CORTEX_ALLOWED_MCP_HOSTS:-localhost,127.0.0.1,[::1]}
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
    ports:
      - '127.0.0.1:${PORT:-8080}:${PORT:-8080}'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - cortex-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

volumes:
  cortex-data:
    name: cortex-universal-data
